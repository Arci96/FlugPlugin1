name: FlugPlugin
version: 1.0.0
main: de.fly.FlugPlugin
api-version: '1.21'
description: Creative-Flug im Survival mit einstellbarer Geschwindigkeit
commands:
  fly:
    description: Fliegen an- oder ausschalten
    usage: /fly
    permission: flug.use
  flyspeed:
    description: Fluggeschwindigkeit einstellen (0 bis 10)
    usage: /flyspeed <0-10>
    permission: flug.use
permissions:
  flug.use:
    description: Erlaubt /fly und /flyspeed
    default: op
